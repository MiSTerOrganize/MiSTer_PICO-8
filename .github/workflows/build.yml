name: Build MiSTer ARM
# Empty on push, so GitHub falls back to its own default -- the commit
# message, which the Actions UI renders as the FIRST LINE. Passing the raw
# message here instead put the whole multi-line body in the run title.
# Dispatch still gets a real label (the reason, else the branch), which is
# the point of overriding at all -- its default is just the workflow name.
run-name: "${{ inputs.reason || (github.event_name == 'workflow_dispatch' && github.ref_name) || '' }}"

on:
  push:
    branches: [main]
    tags: ['v*']
    # Harness tooling is not compiled into the ARM binary, so a tools/**
    # push has nothing to rebuild. Without this filter it still triggers a
    # full QEMU build AND a commit-back, which re-ships the binary to every
    # update_all user for no functional change: measured 2026-08-03, two
    # harness-only pushes each moved the shipped hash. (The bytes that
    # differ are the 20-byte GNU build-id note, not code -- the real fix is
    # -Wl,--build-id=none at link time; this filter avoids the trigger.)
    paths-ignore:
      - 'tools/**'
      # Markdown cannot change the ARM binary, so a docs edit must not rebuild
      # and re-commit it -- that re-ships ~2.2 MB to every update_all user for
      # nothing. Demonstrated 2026-08-16: a docs/dev/** push triggered a full
      # rebuild. Shipped docs still propagate -- dispatch_db.yml and
      # refresh_release.yml both trigger on docs/** and are unaffected by this.
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build label (shown as the run title in the Actions tab)'
        required: false
        type: string

jobs:
  build-arm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # 🛑 THE GATES RUN HERE, BEFORE THE BUILD, so a failure stops the SHIP.
      #
      # These same checks also run in diff_harness.yml -- but that is a separate
      # workflow with no `needs:` or `workflow_run:` relationship to this one, so
      # the two fire in PARALLEL on the same push. A commit that broke the .inp
      # parser would still reach the commit-back and the DB dispatch, shipping to
      # every update_all user, while the harness went red minutes later. Running
      # them again here costs a couple of minutes of a runner and converts that
      # race into a gate.
      #
      # Kept in diff_harness.yml as well: it additionally builds the headless
      # engine and runs the corpus scan, and it fires on pushes this workflow's
      # paths-ignore filter deliberately skips.
      # 🛑 SHIP-ONLY GATE. Pushing to main IS the ship, and the standing rule is
      # that a new RBF and a new ARM binary go together. CI builds only the ARM
      # half, so without this a source push that moved the wire contract would
      # auto-ship a binary against whatever bitstream is in _Other/ -- and the
      # replay-slot picker adds a NEW DDR3 word, so under the old RBF that offset
      # is dead space holding the previous core's leftovers.
      #
      # Restricted to the SHIP refs -- main and tags -- deliberately: a
      # workflow_dispatch validation build on a branch SHOULD still run while the
      # RBF is being recompiled. It is the ship that must wait, not the
      # verification. Tags count as a ship because the release published below
      # goes to the pinning-tool/manual-download channel.
      # The gate below reads per-file commit times, which a depth-1 checkout
      # cannot answer -- every tracked file reports the shallow boundary, so the
      # rbf and the RTL tie and the comparison can never fail. It reported a
      # green PASS in that state until 2026-08-13.
      #
      # blob:none, NOT fetch-depth: 0. This repo's history is ~450 MB, almost
      # all of it committed rbf and ARM-binary blobs; a blobless unshallow gets
      # every commit and tree while leaving those on the server. GitHub honours
      # the filter (a file:// remote does not, so a local repro of this prints
      # "filtering not recognized" and is a worst case, not a representative one).
      #
      # || true: an already-complete clone makes --unshallow an error, and the
      # checker refuses on its own if this step fails to do its job.
      # Tags too, not main only. `on: push tags: ['v*']` publishes a GitHub
      # Release further down, and with these gated to main a tag cut from a
      # commit carrying diagnostic markers -- or one whose RBF and ARM binary do
      # not pair -- shipped to the pinning-tool/manual-download channel with no
      # gate having run at all.
      - name: Deepen history for the RBF/ARM contract gate
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: git fetch --unshallow --filter=blob:none || true
      - name: Gate - RBF and ARM binary ship together (main and tags)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: python3 tools/harness/test_rbf_arm_contract.py
      - name: Gate - CI staleness guard
        run: python3 -m pip install --quiet pyyaml && python3 tools/harness/test_ci_staleness_guard.py
      - name: Gate - pause-menu mode parity (replay desync)
        run: python3 tools/harness/menu_mode_parity_check.py
      - name: Gate - save-payload parser (untrusted input)
        run: python3 tools/harness/test_snap_payload.py
      - name: Gate - recorder slot selection
        run: python3 tools/harness/test_slot_selection.py
      # The payload gate above cuts the READER out and drives it with malformed
      # input -- so it cannot see a WRITER that emits something illegal. This is
      # that half: it extracts each side's bounds from the shipped source and
      # asserts they agree. OpenBOR shipped this exact blind spot twice.
      - name: Gate - writer/reader agreement
        run: python3 tools/harness/test_writer_reader_agree.py
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build in ARM container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/build \
            -w /build \
            arm32v7/debian:bullseye-slim \
            bash -c '
              set -e

              apt-get update -qq
              apt-get install -y -qq g++ cmake make wget libasound2-dev >/dev/null 2>&1

              # ── Step 1: Build SDL 1.2.15 as static library ──────────────
              SDL_PREFIX=/tmp/sdl12
              if [ ! -f "$SDL_PREFIX/lib/libSDL.a" ]; then
                echo "=== Building SDL 1.2.15 (static, fbcon, ALSA) ==="
                cd /tmp
                # Fetch with mirrors, an integrity check and a retry pass.
                # `wget && tar xzf` alone is not enough: a mirror answering 200
                # with a truncated body or an HTML error page makes wget exit 0,
                # so the corrupt file sails through and tar dies with "Error is
                # not recoverable" -- the failure still visible on the OpenBOR_4086
                # repo CI run. `tar tzf` lists without extracting, proving gzip
                # integrity in milliseconds. Mirrors handle a bad mirror; the
                # outer retry handles a network blip that hits them all at once.
                # Mirrors the fetch_verify in OpenBOR_7533 (parity, 2026-08-15).
                fetch_verify() {
                  _fv_out="$1"; shift
                  _fv_try=1
                  while [ $_fv_try -le 3 ]; do
                    for _fv_url in "$@"; do
                      rm -f "$_fv_out"
                      if wget -q "$_fv_url" -O "$_fv_out" && tar tzf "$_fv_out" >/dev/null 2>&1; then
                        return 0
                      fi
                      echo "WARN: $_fv_url did not yield a valid archive; trying the next mirror" >&2
                    done
                    if [ $_fv_try -lt 3 ]; then
                      echo "WARN: every mirror for $_fv_out failed on round $_fv_try; retrying" >&2
                      sleep 3
                    fi
                    _fv_try=$((_fv_try + 1))
                  done
                  rm -f "$_fv_out"
                  return 1
                }
                fetch_verify SDL-1.2.15.tar.gz \
                  https://www.libsdl.org/release/SDL-1.2.15.tar.gz \
                  https://github.com/libsdl-org/SDL-1.2/releases/download/release-1.2.15/SDL-1.2.15.tar.gz \
                  || { echo "ERROR: could not fetch a valid SDL-1.2.15.tar.gz" >&2; exit 1; }
                tar xzf SDL-1.2.15.tar.gz
                [ -d SDL-1.2.15 ] || { echo "ERROR: SDL-1.2.15 did not extract" >&2; exit 1; }
                cd SDL-1.2.15
                ./configure \
                  --prefix=$SDL_PREFIX \
                  --disable-video-x11 \
                  --disable-video-opengl \
                  --disable-cdrom \
                  --disable-shared \
                  --enable-static \
                  --disable-pulseaudio \
                  --disable-esd \
                  --enable-alsa \
                  --enable-video-fbcon \
                  --quiet
                make -j$(nproc) --quiet
                make install --quiet
                echo "SDL built: $(du -h $SDL_PREFIX/lib/libSDL.a | cut -f1)"
              fi

              # ── Step 2: Build MiSTer_PICO-8 ─────────────────────────────
              echo "=== Building MiSTer_PICO-8 ==="
              cd /build
              mkdir -p build-arm && cd build-arm
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-mcpu=cortex-a9 -mtune=cortex-a9 -mfloat-abi=hard -mfpu=neon" \
                -DCMAKE_CXX_FLAGS="-mcpu=cortex-a9 -mtune=cortex-a9 -mfloat-abi=hard -mfpu=neon" \
                -DSDL_STATIC_PREFIX=$SDL_PREFIX
              make -j$(nproc)

              echo "=== Binary info ==="
              ls -lh PICO-8
            '

      - name: Commit fresh ARM binary back to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # 🛑 NO continue-on-error here. It used to carry it, with the honest
        # reason "don't lose the artifact upload if push races" -- but it also
        # swallowed the retry loop's own `exit 1`, the one written so a stale
        # ship chain cannot look green. GitHub marked the step failed and the
        # JOB success, so an exhausted commit-back reported GREEN while the
        # binary never reached main: exactly the silent staleness the loop
        # exists to prevent, and a divergence from OpenBOR, which never had it.
        #
        # The artifact concern was real and is fixed where it belongs -- on the
        # packaging and upload steps, which now run with if: always().
        env:
          # For the staleness guard's `gh api` ancestry query. Read-only use of
          # the repo's own token; the DB/release dispatches below still use the
          # cross-repo PAT, which GITHUB_TOKEN cannot replace.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Save the freshly-built binary outside the worktree so we can
          # always restore it after any rebase/conflict, no matter what
          # state main is in.
          mkdir -p /tmp/ci-binary
          cp build-arm/PICO-8 /tmp/ci-binary/PICO-8
          # Snapshot the bios FROM THIS BUILD'S COMMIT alongside the binary.
          # (2026-07-21 race: the commit-back loop resets to origin/main,
          # which may have MOVED past this build's commit -- syncing the
          # bios from the post-reset tree shipped a mismatched pair:
          # commit d638496 carried the 1f23bc6 binary with the 0d07d88
          # scheduler bios. Binary + bios must come from the same commit.)
          cp src/pico8/bios.p8 /tmp/ci-binary/bios.p8
          git config user.email "ci@misterorganize"
          git config user.name "MiSTer Organize CI"
          # Diagnostic-marker gate (added 2026-05-25 per feedback_no_diagnostic_binaries_in_db.md):
          # Universal hybrid-core rule. If any source path that contributes to the final
          # binary carries TEMPORARY / SUB-PROFILE / DIAG instrumentation (in PICO-8's
          # case: src/ C++ sources OR bios.p8 Lua sandbox-side), the rebuilt binary is
          # for research only and MUST NOT land on main (where DB rebuild would pick up
          # its hash and ship it via db.json to end users). Binary still uploads as
          # workflow artifact below for manual deploy testing.
          # No 2>/dev/null: grep exits 2 on a missing path, which `if` reads
          # exactly like "no markers found", so moving src/ would turn this gate
          # into a silent pass. Assert the paths exist, then let grep speak.
          for p in src games/PICO-8/bios.p8; do
            [ -e "$p" ] || { echo "::error::diagnostic gate cannot scan '$p' (missing) — refusing to commit blind"; exit 1; }
          done
          if grep -rqE "TEMPORARY PROFILE|TEMPORARY DIAG|TEMPORARY SUB-PROFILE|REVERT AFTER MEASURED" src games/PICO-8/bios.p8; then
            echo "[CI gate] Diagnostic markers detected in src/ or bios.p8 — SKIPPING binary commit-back."
            echo "[CI gate] Binary built successfully and uploads as workflow artifact for manual deploy."
            echo "[CI gate] Will commit binary back automatically once diagnostic markers are removed."
            exit 0
          fi
          # Try up to 5 times — if main moved (sibling CI raced ahead),
          # reset to origin/main, overwrite the binary with OUR fresh one,
          # commit, push. Avoid `git pull --rebase` because the binary
          # merge conflict cannot be auto-resolved.
          PUSH_OK=0
          NOTHING_TO_DO=0
          STALE=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # --- Staleness guard --------------------------------------------
            # The re-apply above is right that a build must never be LOST, but
            # it never asks whether the tip already carries a NEWER binary. Two
            # builds overlap whenever pushes land close together, and they do
            # NOT finish in start order. Measured 2026-08-04 on OpenBOR_7533:
            # the 0ea791c build ran 00:46->01:15 while the d4815ef build ran
            # 00:52->01:07, so the OLDER source finished LAST, re-applied its
            # binary over the newer one, and main shipped a stale binary until
            # an unrelated build happened to heal it. Same loop, same exposure
            # here -- and the sibling of the 2026-07-21 race noted above, which
            # was this identical reset-to-tip window shipping a mismatched
            # binary+bios pair.
            #
            # Ancestry is asked of the API rather than the local clone:
            # actions/checkout is depth-1, so `git merge-base` has no history to
            # reason over. compare/{base}...{head} reports "ahead" when head is
            # ahead of base.
            #
            # FAILS OPEN on every uncertainty -- no marker commit, unparseable
            # message, API error, unrelated histories. The guard may only skip a
            # push it is certain is stale; when unsure it must defer to the old
            # behaviour, because wrongly skipping loses a build silently.
            TIP_SRC=$(gh api "repos/${{ github.repository }}/commits?path=games/PICO-8/PICO-8&per_page=1" \
                        --jq '.[0].commit.message' 2>/dev/null \
                      | sed -n '1s/^CI: rebuild ARM binary for \([0-9a-f]\{40\}\)$/\1/p')
            if [ -n "$TIP_SRC" ] && [ "$TIP_SRC" != "${{ github.sha }}" ]; then
              REL=$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...$TIP_SRC" \
                      --jq '.status' 2>/dev/null || echo unknown)
              if [ "$REL" = "ahead" ]; then
                echo "[staleness guard] main already carries a binary built from $TIP_SRC,"
                echo "  which is AHEAD of this run's source ${{ github.sha }}."
                echo "  This build is stale -- refusing to overwrite a newer binary."
                echo "  It is still uploaded as a workflow artifact if you need it."
                STALE=1
                break
              fi
              echo "[staleness guard] tip binary source $TIP_SRC is '$REL' vs this run -- proceeding."
            fi
            cp /tmp/ci-binary/PICO-8 games/PICO-8/PICO-8
            chmod +x games/PICO-8/PICO-8
            # Keep the SHIPPED bios in lockstep with THIS BUILD'S source bios.
            # (2026-07-20 incident: games/PICO-8/bios.p8 sat frozen at its
            # May-13 manual sync while src/pico8/bios.p8 accumulated the
            # multicart yield-forever fix, print('ok') removal, and the
            # rnd(table) fix — update_all shipped the stale copy to every
            # device. The shipped file is a pure copy of src/pico8/bios.p8;
            # never edit it directly.)
            cp /tmp/ci-binary/bios.p8 games/PICO-8/bios.p8
            if git diff --quiet games/PICO-8/PICO-8 games/PICO-8/bios.p8; then
              echo "ARM binary + bios unchanged after sync — nothing to commit."
              NOTHING_TO_DO=1
              break
            fi
            git add games/PICO-8/PICO-8 games/PICO-8/bios.p8
            git commit -m "CI: rebuild ARM binary for ${{ github.sha }}"
            if git push; then
              echo "Push succeeded on attempt $i."
              PUSH_OK=1
              break
            fi
            echo "Push failed (attempt $i), resyncing and retrying..."
            sleep 2
          done
          # Exhausting the loop used to leave the job GREEN with no binary on
          # main -- a silently stale ship chain. Fail loudly instead.
          if [ "$PUSH_OK" != "1" ] && [ "$NOTHING_TO_DO" != "1" ] && [ "$STALE" != "1" ]; then
            echo "::error::Binary commit-back failed after 5 attempts. The binary is still available as a workflow artifact; deploy manually or re-run."
            exit 1
          fi
          # Trigger MiSTer_Frontier DB rebuild on successful binary push so
          # db.json reflects the new hash promptly (prevents update_all hash-
          # mismatch failures in the window between binary push and daily cron).
          # Requires MISTER_FRONTIER_DISPATCH_TOKEN secret (classic PAT,
          # workflow scope, no expiration -- threat model justifies this:
          # token only triggers workflow_dispatch on MiSTer_Frontier).
          # If unset, just warns (daily cron handles propagation slower).
          if [ "$PUSH_OK" = "1" ]; then
            if [ -n "${{ secrets.MISTER_FRONTIER_DISPATCH_TOKEN }}" ]; then
              echo "Triggering MiSTer_Frontier DB rebuild..."
              GH_TOKEN="${{ secrets.MISTER_FRONTIER_DISPATCH_TOKEN }}" \
                gh workflow run "Build Custom Database" -R MiSTerOrganize/MiSTer_Frontier \
                || echo "WARN: DB dispatch failed (token may be expired)"
              # Refresh the rolling 'latest' GitHub Release so its zip asset
              # matches the just-committed binary. The commit-back push above
              # used GITHUB_TOKEN, which does NOT re-trigger refresh_release's
              # `on: push`, so we dispatch it explicitly (same PAT as the DB
              # rebuild). Manual RBF/handler/README pushes hit its on:push path
              # trigger directly. Content-gated -> a redundant fire is a no-op.
              echo "Triggering rolling 'latest' release refresh..."
              GH_TOKEN="${{ secrets.MISTER_FRONTIER_DISPATCH_TOKEN }}" \
                gh workflow run refresh_release.yml -R ${{ github.repository }} \
                || echo "WARN: refresh_release dispatch failed"
            else
              echo "WARN: MISTER_FRONTIER_DISPATCH_TOKEN not set -- skipping DB auto-dispatch."
              echo "      Add this PAT secret to close the db.json staleness window."
            fi
          fi

      - name: Package release zip
        # if: always() so a commit-back that loses a push race still leaves a
        # deployable artifact. This is where the artifact concern belongs --
        # NOT on the commit-back step, where continue-on-error also swallowed
        # the exhaustion exit that keeps a stale ship chain from looking green.
        if: always()
        run: |
          mkdir -p release-staging/games/PICO-8 release-staging/_Other release-staging/docs/PICO-8
          cp build-arm/PICO-8 release-staging/games/PICO-8/
          # bios.p8 comes from src/ -- the SOURCE OF TRUTH -- exactly like the
          # binary above comes from the build, not from the repo copy.
          #
          # The src -> games/ sync lives inside the commit-back step, which only
          # runs on a push to main. So on a workflow_dispatch / branch build the
          # sync never happens, and copying games/PICO-8/bios.p8 here shipped a
          # STALE bios in the artifact -- silently, since the binary beside it
          # was fresh. Caught 2026-08-01: a branch artifact carried a bios 50
          # lines behind src/, missing the whole Recording submenu and stat(148),
          # so deploying that artifact wholesale would have REGRESSED the device.
          # Same drift class as the 2026-07-20 incident, just reached by the
          # branch path instead of the manual-sync one.
          cp src/pico8/bios.p8 release-staging/games/PICO-8/
          cp games/PICO-8/_handler.sh release-staging/games/PICO-8/
          # Assert exactly one, as refresh_release.yml already does for the
          # same shipped set. An unasserted glob let this zip carry two
          # bitstreams while the rolling `latest` path hard-failed -- two ship
          # paths disagreeing about the same invariant.
          _n=$(ls _Other/PICO-8*.rbf | wc -l)
          [ "$_n" = "1" ] || { echo "::error::expected exactly 1 PICO-8 RBF, found $_n"; exit 1; }
          cp _Other/PICO-8*.rbf release-staging/_Other/
          cp docs/PICO-8/README.md release-staging/docs/PICO-8/
          chmod +x release-staging/games/PICO-8/PICO-8 release-staging/games/PICO-8/_handler.sh
          cd release-staging && zip -r ../MiSTer-PICO-8-release.zip _Other/ docs/ games/

      - name: Upload artifact
        # if: always() so a commit-back that loses a push race still leaves a
        # deployable artifact. This is where the artifact concern belongs --
        # NOT on the commit-back step, where continue-on-error also swallowed
        # the exhaustion exit that keeps a stale ship chain from looking green.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer-PICO-8-release
          path: release-staging/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MiSTer-PICO-8-release.zip
