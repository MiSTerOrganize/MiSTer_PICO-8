name: Diff Harness

# Differential bug-finding harness. Builds tools/z8headless (engine-only frame
# dumper, no SDL/MiSTer) FULLY STATIC, smoke-runs it, and uploads the binary +
# bios.p8 so the cart library can be scanned off-device (e.g. via WSL). NOT
# shipped, NOT part of the ARM binary. Fast (~2 min): native x86-64, no QEMU/SDL.

on:
  # 🛑 PUSH TRIGGER IS LOAD-BEARING. This was workflow_dispatch-only, so the
  # hard gates it carries -- the untrusted-input payload parser, slot-selection
  # conformance, and the pause-menu mode-parity check -- ran only when somebody
  # remembered. Slot-selection sat RED from 2026-08-07 to 08-10: commit 4110894
  # deliberately removed p8rec_first_free and the test still demanded it, so it
  # exited 2 ("could not cut") and nothing said so. A gate nobody runs protects
  # nothing.
  #
  # The path list is an ALLOW-list, so getting it wrong means a change silently
  # never gets checked. Prefer a wasted 2-minute run over a missed one.
  push:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/diff_harness.yml'
      - 'src/**'
      - 'tools/**'
      - 'games/PICO-8/bios.p8'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label'
        required: false
        type: string
      addrs:
        description: 'Crash addresses to resolve via addr2line (space-separated hex)'
        required: false
        type: string

run-name: ${{ inputs.reason || 'diff-harness' }}

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      # 🛑 This test existed on BOTH cores and NO workflow ran it. The staleness
      # guard it covers is what stops an older build finishing last and shipping
      # a stale binary over a newer one -- a failure that is invisible because
      # both runs report success. A guard whose test is never executed is a
      # guard nobody is checking. Triggered on build.yml too, since that is the
      # file it validates.
      - name: CI staleness-guard tests (commit-back cannot ship stale)
        run: python3 -m pip install --quiet pyyaml && python3 tools/harness/test_ci_staleness_guard.py
      # Runs before the engine build and is a hard gate. p8snap_read turns a
      # stranger's bytes into filenames, and its .p8d.txt check is what stops an
      # entry called <cart>.p8 -- a cstore overlay -- being spliced over the
      # cart's ROM before the first frame. Needs no hardware: it cuts the real
      # function out of mister_main.cpp and compiles it natively.
      - name: Pause-menu mode-parity (replay-desync gate)
        run: python3 tools/harness/menu_mode_parity_check.py
      - name: Save-payload parser tests (untrusted input)
        run: python3 tools/harness/test_snap_payload.py
      # Slot-selection conformance (recording checklist items 1, 3, 11). Pure
      # logic, so it needs no controller: cuts the four real slot helpers out of
      # mister_main.cpp and compiles them. Guards the defect class where a
      # PARSED slot name disagrees with the GENERATED one the loader rebuilds --
      # which broke Play permanently on a zero-padded copy.
      - name: Recorder slot-selection tests
        run: python3 tools/harness/test_slot_selection.py
      # The golden GATE itself cannot run here -- the trace corpus is gitignored
      # and the cart library is not in any repo -- so it runs locally, next to
      # the data. What CAN run here is the guard on it: golden_check.sh must
      # reproduce trace_worker.sh's run conditions exactly, because a golden is
      # only comparable to a run made the same way. A condition changed in one
      # and not the other makes every layout-sensitive cart drift at once and
      # the gate blames the engine. Pure text comparison, no corpus needed.
      - name: Golden-gate worker sync (produces vs checks)
        run: python3 tools/harness/test_golden_check_sync.py

      - name: Build z8headless (engine-only, fully static, with -g for addr2line)
        run: |
          cmake -B build -DBUILD_HEADLESS=ON -DSKIP_SDL_FRONTEND=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer"
          cmake --build build --target z8headless -j$(nproc)
          file build/z8headless
      - name: Resolve crash addresses (addr2line)
        if: ${{ inputs.addrs != '' }}
        run: |
          echo "Resolving against build/z8headless: ${{ inputs.addrs }}"
          addr2line -f -C -i -e build/z8headless ${{ inputs.addrs }}
      - name: Smoke run on test cart
        run: |
          mkdir -p out
          cp src/pico8/bios.p8 ./bios.p8     # BIOS resolves via cwd (empty data-path prefix)
          ./build/z8headless --cart tools/test_carts/shapes.p8 --frames 90 --dump 1,30,60,89 --out out
          ls -la out
      # save_p8 used to end `std::ofstream(filename) << ret; return true;` -- no
      # open check, no write check, success reported unconditionally, all the way
      # up through cart::save -> vm::save_cart -> api_cstore. It hid nothing in
      # practice, which is exactly why it survived four months: a return value
      # that CANNOT say "no" is not a check, and the next real failure here would
      # have been invisible in the same way.
      #
      # ENOTDIR is the failure injection because it cannot be bypassed: chmod is
      # useless here since CI runs as root, and the first version of this test
      # "passed" by writing the file anyway.
      - name: cstore reports a failed write (save_p8 returns the truth)
        run: |
          set -e
          mkdir -p out
          printf 'pico-8 cartridge // http://www.pico-8.com\nversion 42\n__lua__\npoke(0x3100,0x5a)\ncstore()\n' > out/cst.p8
          : > out/blocker                      # a regular FILE, so a dir under it is ENOTDIR
          Z8_SAVES_DIR=out/wr ./build/z8headless --cart out/cst.p8 --frames 2 --dump list --out out > out/ok.log 2>&1 || true
          Z8_SAVES_DIR=out/blocker/sub ./build/z8headless --cart out/cst.p8 --frames 2 --dump list --out out > out/bad.log 2>&1 || true
          # the driver must actually have run -- usage or a nil-value error would
          # otherwise read as "no failure reported"
          grep -qE "^usage:|attempt to call a nil value" out/bad.log && { echo "TEST DID NOT RUN"; cat out/bad.log; exit 1; } || true
          test -f out/wr/cst.p8 || { echo "FAIL: the writable case did not persist"; exit 1; }
          grep -q "cannot save cart" out/bad.log || { echo "FAIL: no open error reported"; cat out/bad.log; exit 1; }
          grep -q "could not persist" out/bad.log || { echo "FAIL: api_cstore swallowed the failure"; cat out/bad.log; exit 1; }
          test ! -f out/blocker/sub/cst.p8 || { echo "FAIL: a partial cart was left behind"; exit 1; }
          echo "OK: persists when it can, reports both failures when it cannot, leaves no partial"

      - name: Golden-master trace determinism check (--test)
        run: |
          # Two boot-to-frame-120 runs must produce byte-identical hash
          # traces (frame:videocrc:audiocrc) — the golden-master contract.
          ./build/z8headless --cart tools/test_carts/shapes.p8 --frames 120 --test out/trace_a.txt
          ./build/z8headless --cart tools/test_carts/shapes.p8 --frames 120 --test out/trace_b.txt
          diff out/trace_a.txt out/trace_b.txt
          test "$(wc -l < out/trace_a.txt)" -eq 120
          echo "trace deterministic OK:"
          head -5 out/trace_a.txt
      # The determinism check above runs two traces of ONE cart and diffs them
      # against EACH OTHER. That proves the engine is reproducible and is blind
      # to it being deterministically WRONG -- every frame of every cart can
      # shift identically and still pass. This step is the missing half: compare
      # against STORED goldens, so a behaviour change has to be acknowledged.
      #
      # Only the 28 repo-owned carts, because CI can only legitimately see those
      # -- the 3,302-cart corpus is third-party content in no repo, and its
      # goldens are gitignored in a repo with no remote. The corpus gate runs
      # locally (tools/harness/golden_gate.sh); this is the CI-visible subset.
      - name: Golden traces for repo-owned carts (behaviour regression gate)
        run: Z8=./build/z8headless bash tools/harness/repo_golden_gate.sh
      - name: Stage binary bundle
        run: |
          mkdir -p bundle
          cp build/z8headless bundle/z8headless
          cp src/pico8/bios.p8 bundle/bios.p8
      - uses: actions/upload-artifact@v4
        with:
          name: harness-frames
          path: out/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: z8headless-linux
          path: bundle/*
